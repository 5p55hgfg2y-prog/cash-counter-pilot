<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102b34">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kasseoptælling">
<meta name="description" content="Enkel kontantoptælling til iPad og iPhone">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="stylesheet" href="./styles.css">
<title>Kasseoptælling</title>
<script defer src="./app.js"></script>
</head>
<body>
<header class="appbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true">kr</span><strong>Kasseoptælling</strong></div>
  <div class="app-meta"><span id="appVersion" class="version">v10.0.0</span><span class="offline-status" id="status">Offline-klar</span></div>
</header>
<main>
  <section class="panel" id="count">
    <div class="workspace">
      <div class="denominations">
        <div class="heading-row"><div><h1>Kontantoptælling</h1><p>Vælg en valør, og angiv antal.</p></div><button class="restart" type="button" id="resetCount">↺ Start forfra</button></div>
        <div class="mobile-category" aria-label="Vælg kontanttype">
          <button class="category selected" type="button" data-cash="coin" aria-pressed="true">Mønter <span id="coinsSwitchTotal">0,00 kr.</span></button>
          <button class="category" type="button" data-cash="note" aria-pressed="false">Sedler <span id="notesSwitchTotal">0,00 kr.</span></button>
        </div>
        <section class="denom-group" id="coinsGroup" aria-label="Mønter"><h2>Mønter</h2><div id="coins" class="denom-list"></div></section>
        <section class="denom-group" id="notesGroup" aria-label="Sedler"><h2>Sedler</h2><div id="notes" class="denom-list"></div></section>
      </div>
      <aside class="count-tools">
        <div class="total-box"><span class="eyebrow">OPTALT BELØB</span><strong id="countTotal">0,00 kr.</strong><div class="split-totals"><span>Sedler <b id="notesTotal">0,00 kr.</b></span><span>Mønter <b id="coinsTotal">0,00 kr.</b></span></div></div>
        <div class="keypad-wrap"><div class="keypad" aria-label="Numerisk tastatur">
          <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
          <button type="button" data-key="clear" aria-label="Ryd antal">C</button><button type="button" data-key="0">0</button><button type="button" data-key="back" aria-label="Slet sidste ciffer">⌫</button>
        </div><button type="button" class="next" id="nextDenom">Næste <span aria-hidden="true">↓</span></button></div>
        <button type="button" class="confirm" id="confirmCount">Bekræft optælling</button>
        <p class="hint">Gemmes lokalt på denne enhed. Ingen overførsel til POS.</p>
      </aside>
    </div>
  </section>

</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
